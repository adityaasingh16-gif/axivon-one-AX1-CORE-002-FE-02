    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="sideAvatar">--</div>
        <div class="who">
          <strong id="sideName">&nbsp;</strong>
          <span id="sideEmail">&nbsp;</span>
        </div>
      </div>
      <button type="button" class="btn btn-on-ink btn-block btn-sm" id="logoutBtn">
        <span class="spinner"></span>

  <main class="app-main">
<div class="page-head"><div><p class="eyebrow">User Management</p><h1>Membership</h1><p>Manage the plan assigned to each user.</p></div><a href="users.html" class="btn btn-ghost">Open user list</a></div>
<section class="panel"><div class="panel-head"><div><h2>Membership overview</h2><p>Choose a plan to see matching users. Plans can be changed from User Details or Edit.</p></div></div><div class="feature-grid" id="membershipCards"></div></section>
  </main>
</div>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/users.js"></script>
<script>
(function(){
 var Auth=window.AxivonAuth,Users=window.AxivonUsers; var session=Auth.requireAuth(); if(!session)return; var u=Auth.currentUser(); if(!u){Auth.clearSession();location.replace('login.html');return;}
 document.getElementById('gate').style.display='none';document.getElementById('appShell').style.display='grid';document.getElementById('sideAvatar').textContent=Auth.initials(u.fullName);document.getElementById('sideName').textContent=u.fullName;document.getElementById('sideEmail').textContent=u.email;document.getElementById('logoutBtn').addEventListener('click',function(){Auth.logout();location.href='login.html?loggedout=1';});
 var counts={free:0,basic:0,pro:0,enterprise:0}; Users.getAll().forEach(function(x){counts[x.membership]=(counts[x.membership]||0)+1;}); var labels=Users.MEMBERSHIP_LABEL; document.getElementById('membershipCards').innerHTML=Users.MEMBERSHIPS.map(function(k){return '<a class="feature-card" href="users.html?membership='+k+'"><h3>'+labels[k]+'</h3><p>'+counts[k]+' user(s) currently on this plan.</p><span class="btn btn-ghost btn-sm">View '+labels[k]+' →</span></a>';}).join('');
})();
</script>
</body>
</html>
