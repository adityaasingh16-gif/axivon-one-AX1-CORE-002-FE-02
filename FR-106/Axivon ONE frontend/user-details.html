<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User details — AXIVON ONE</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="spin" aria-hidden="true"></div>
  <p>Checking your session&hellip;</p>
</div>

<div class="app-shell" id="appShell" style="display:none;">
  <aside class="app-sidebar">
    <a href="index.html" class="brand">
      <span class="brand-logo-wrap">
        <img class="brand-logo" src="assets/images/axivon-logo.png" alt="Axivon Technologies" width="786" height="727">
      </span>
    </a>

    <nav class="side-nav" aria-label="Dashboard">
      <p class="side-nav-label">Workspace</p>
      <a href="dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>
        Overview
      </a>
      <a href="user-management.html" class="is-active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.3" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 19c.7-3.4 3.2-5.3 5.5-5.3s4.8 1.9 5.5 5.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8.5" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M15.3 13.3c2 .3 3.7 1.9 4.2 4.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Users
      </a>
      <a href="sessions.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Sessions
      </a>
      <a href="security.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5.5c0 4.6-3 8-7 9-4-1-7-4.4-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Security
      </a>
      <a href="settings.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10.5a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10.5a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="sideAvatar">--</div>
        <div class="who">
          <strong id="sideName">&nbsp;</strong>
          <span id="sideEmail">&nbsp;</span>
        </div>
      </div>
      <button type="button" class="btn btn-on-ink btn-block btn-sm" id="logoutBtn">
        <span class="spinner"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="panel-actions" style="margin-bottom:18px;">
      <a href="user-management.html" class="btn btn-ghost btn-sm">User Management</a>
      <a href="users.html" class="btn btn-ghost btn-sm">User List</a>
      <a href="status.html" class="btn btn-ghost btn-sm">Status</a>
      <a href="membership.html" class="btn btn-ghost btn-sm">Membership</a>
    </div>
    <a href="users.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Users
    </a>

    <div id="directoryState" class="panel"><div class="panel-head"><div><h2>All User Profiles</h2><p>Active, pending, inactive, suspended and banned accounts are shown here.</p></div><a href="user-form.html" class="btn btn-primary btn-sm">+ Create user</a></div></div><div id="profileDirectory" class="feature-grid" style="display:none;margin-top:18px;"></div>
    <div id="detailsContent"></div>
    <div id="stateWrap" style="display:none;"></div>
  </main>
</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/users.js"></script>
<script>
(function(){
  var Auth = window.AxivonAuth, UI = window.AxivonUI, Users = window.AxivonUsers;

  var session = Auth.requireAuth();
  if (!session) return;

  var sessionUser = Auth.currentUser();
  if (!sessionUser) {
    Auth.clearSession();
    location.replace('login.html');
    return;
  }

  document.getElementById('gate').style.display = 'none';
  document.getElementById('appShell').style.display = 'grid';

  document.getElementById('sideAvatar').textContent = Auth.initials(sessionUser.fullName);
  document.getElementById('sideName').textContent = sessionUser.fullName;
  document.getElementById('sideEmail').textContent = sessionUser.email;

  function doLogout(btn){
    UI.setLoading(btn, true);
    setTimeout(function(){
      Auth.logout();
      location.href = 'login.html?loggedout=1';
    }, 400);
  }
  document.getElementById('logoutBtn').addEventListener('click', function(){ doLogout(this); });

  // ---------------- profile details ----------------
  var content = document.getElementById('detailsContent');
  var stateWrap = document.getElementById('stateWrap');
  var S = Users.Store.getState();
  var id = UI.qs('id');

  function showState(kind, opts){
    content.style.display = 'none';
    stateWrap.style.display = '';
    Users.renderDataState(stateWrap, kind, opts);
  }
  function showContent(){ content.style.display = ''; stateWrap.style.display = 'none'; }

  function renderDetails(u){
    S.selectedUser = u;
    showContent();
    content.innerHTML =
      '<div class="page-head">' +
        '<div class="profile-head">' +
          '<div class="avatar-lg">' + Users.escapeHtml(Users.initials(u.fullName)) + '</div>' +
          '<div class="name-block">' +
            '<h2>' + Users.escapeHtml(u.fullName) + '</h2>' +
            '<div class="pill-row">' + Users.statusBadge(u.status) + Users.membershipBadge(u.membership) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel-actions">' +
          '<a href="' + Users.Routes.userEdit(u.id) + '" class="btn btn-primary">Edit user</a>' +
        '</div>' +
      '</div>' +

      '<section class="panel">' +
        '<div class="panel-head"><div><h2>Profile</h2><p>Contact and role information.</p></div></div>' +
        '<div class="kv-list">' +
          '<div class="kv-row"><span class="k">Full name</span><span class="v">' + Users.escapeHtml(u.fullName) + '</span></div>' +
          '<div class="kv-row"><span class="k">Email</span><span class="v">' + Users.escapeHtml(u.email) + '</span></div>' +
          '<div class="kv-row"><span class="k">Phone</span><span class="v">' + Users.escapeHtml(u.phone || '\u2014') + '</span></div>' +
          '<div class="kv-row"><span class="k">Department</span><span class="v">' + Users.escapeHtml(u.department || '\u2014') + '</span></div>' +
          '<div class="kv-row"><span class="k">Job title</span><span class="v">' + Users.escapeHtml(u.jobTitle || '\u2014') + '</span></div>' +
          '<div class="kv-row"><span class="k">Account ID</span><span class="v mono">' + Users.escapeHtml(u.id) + '</span></div>' +
        '</div>' +
      '</section>' +

      (u.bio ? (
        '<section class="panel">' +
          '<div class="panel-head"><div><h2>About</h2></div></div>' +
          '<p style="margin:0;">' + Users.escapeHtml(u.bio) + '</p>' +
        '</section>'
      ) : '') +

      '<section class="panel">' +
        '<div class="panel-head"><div><h2>Status &amp; membership</h2><p>Manage the user lifecycle and plan directly from this profile.</p></div></div>' +
        '<div class="form-grid" style="margin-bottom:16px;">' +
          '<div class="field"><label for="detailStatus">Status</label><select class="select-input" id="detailStatus" style="width:100%;"><option value="active">Active</option><option value="pending">Pending</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option><option value="banned">Banned</option></select></div>' +
          '<div class="field"><label for="detailMembership">Membership</label><select class="select-input" id="detailMembership" style="width:100%;"><option value="free">Free</option><option value="basic">Basic</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select></div>' +
        '</div>' +
        '<div class="kv-list">' +
          '<div class="kv-row"><span class="k">Current status</span><span class="v" id="detailStatusBadge">' + Users.Components.statusBadge(u.status) + '</span></div>' +
          '<div class="kv-row"><span class="k">Current membership</span><span class="v" id="detailMembershipBadge">' + Users.Components.membershipBadge(u.membership) + '</span></div>' +
          '<div class="kv-row"><span class="k">Created</span><span class="v">' + Users.formatDate(u.createdAt) + '</span></div>' +
          '<div class="kv-row"><span class="k">Last updated</span><span class="v">' + Users.formatDate(u.updatedAt) + '</span></div>' +
        '</div>' +
        '<div class="panel-actions" style="margin-top:16px;"><button type="button" class="btn btn-primary btn-sm" id="saveLifecycleBtn">Save status &amp; membership</button></div>' +
      '</section>' +

      '<section class="panel">' +
        '<div class="panel-head"><div><h2>Available actions</h2></div></div>' +
        '<div class="panel-actions">' +
          '<a href="' + Users.Routes.userEdit(u.id) + '" class="btn btn-ghost btn-sm">Edit user</a>' +
          (u.status !== 'active'
            ? '<button type="button" class="btn btn-ghost btn-sm" data-set-status="active">Set active</button>'
            : '<button type="button" class="btn btn-ghost btn-sm" data-set-status="inactive">Set inactive</button>') +
          (u.status !== 'suspended'
            ? '<button type="button" class="btn btn-danger btn-sm" data-set-status="suspended">Suspend user</button>'
            : '<button type="button" class="btn btn-ghost btn-sm" data-set-status="active">Reactivate</button>') +
          '<a href="users.html" class="btn btn-ghost btn-sm">Back to Users</a>' +
        '</div>' +
      '</section>';

    content.querySelectorAll('[data-set-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var next = btn.getAttribute('data-set-status');
        UI.setLoading(btn, true);
        setTimeout(function(){
          var result = Users.setStatus(u.id, next);
          if (!result.ok) {
            UI.setLoading(btn, false);
            UI.toast(result.error, { icon: 'alert' });
            return;
          }
          UI.toast('Status updated to ' + Users.STATUS_LABEL[next] + '.', { icon: 'check' });
          renderDetails(result.user);
        }, 450);
      });
    });

    var detailStatus = content.querySelector('#detailStatus');
    var detailMembership = content.querySelector('#detailMembership');
    var saveLifecycleBtn = content.querySelector('#saveLifecycleBtn');
    if (detailStatus && detailMembership && saveLifecycleBtn) {
      detailStatus.value = u.status;
      detailMembership.value = u.membership;
      saveLifecycleBtn.addEventListener('click', function () {
        UI.setLoading(saveLifecycleBtn, true);
        setTimeout(function () {
          var result = Users.update(u.id, {
            fullName: u.fullName,
            email: u.email,
            department: u.department,
            jobTitle: u.jobTitle,
            phone: u.phone,
            bio: u.bio,
            status: detailStatus.value,
            membership: detailMembership.value
          });
          UI.setLoading(saveLifecycleBtn, false);
          if (!result.ok) {
            UI.toast(result.error, { icon: 'alert' });
            return;
          }
          Users.Store.selectUser(result.user);
          UI.toast('Status and membership updated.', { icon: 'check' });
          renderDetails(result.user);
        }, 350);
      });
    }
  }

  function load(){
    showState('loading');
    setTimeout(function(){
      if (!id) {
        var allUsers = Users.getAll();
        var directory = document.getElementById('profileDirectory');
        document.getElementById('detailsContent').innerHTML = '';
        document.getElementById('stateWrap').style.display = 'none';
        document.getElementById('directoryState').style.display = '';
        directory.style.display = 'grid';
        directory.innerHTML = allUsers.map(function(x){ return '<div class="panel profile-card"><div class="user-cell"><div class="avatar-lg">'+Users.escapeHtml(Users.initials(x.fullName))+'</div><div class="who"><strong>'+Users.escapeHtml(x.fullName)+'</strong><span>'+Users.escapeHtml(x.email)+'</span><span>'+Users.statusBadge(x.status)+' '+Users.membershipBadge(x.membership)+'</span></div></div><div class="row-actions" style="margin-top:14px"><a class="btn btn-primary btn-sm" href="user-details.html?id='+encodeURIComponent(x.id)+'">Open details</a><a class="btn btn-ghost btn-sm" href="user-form.html?id='+encodeURIComponent(x.id)+'">Edit</a></div></div>'; }).join('');
        return;
      }
      document.getElementById('directoryState').style.display = 'none';
      document.getElementById('profileDirectory').style.display = 'none';
      var u = Users.getById(id);
      if (!u) {
        showState('error', { title: 'User not found', message: 'This user may have been removed.', actionHtml: '<a href="users.html" class="btn btn-ghost btn-sm">Back to Users</a>' });
        return;
      }
      renderDetails(u);
    }, 350);
  }

  load();
})();
</script>
</body>
</html>
