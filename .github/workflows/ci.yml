name: AXIVON ONE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=optional

      # Vite 8 uses Rolldown native bindings. The lockfile was generated on
      # Windows, so npm ci can omit the Linux x64 optional binding on CI.
      # Install the exact Linux binding explicitly without changing the lockfile.
      - name: Restore Linux Rolldown Binding
        run: npm install --no-save --package-lock=false @rolldown/binding-linux-x64-gnu@1.2.4

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
