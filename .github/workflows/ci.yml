name: AXIVON ONE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=optional

      # npm's workspace dependency resolution can skip the Linux optional
      # Rolldown binding from a cross-platform lockfile. Install it outside
      # workspace processing so Vitest/Vite can load the native binding.
      - name: Restore Linux Rolldown Binding
        run: npm install --no-save --package-lock=false --workspaces=false @rolldown/binding-linux-x64-gnu@1.2.4

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
