<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User form — AXIVON ONE</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="spin" aria-hidden="true"></div>
  <p>Checking your session&hellip;</p>
</div>

<div class="app-shell" id="appShell" style="display:none;">
  <aside class="app-sidebar">
    <a href="index.html" class="brand">
      <span class="brand-logo-wrap">
        <img class="brand-logo" src="assets/images/axivon-logo.png" alt="Axivon Technologies" width="786" height="727">
      </span>
    </a>

    <nav class="side-nav" aria-label="Dashboard">
      <p class="side-nav-label">Workspace</p>
      <a href="dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>
        Overview
      </a>
      <a href="user-management.html" class="is-active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.3" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 19c.7-3.4 3.2-5.3 5.5-5.3s4.8 1.9 5.5 5.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8.5" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M15.3 13.3c2 .3 3.7 1.9 4.2 4.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Users
      </a>
      <a href="sessions.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Sessions
      </a>
      <a href="security.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5.5c0 4.6-3 8-7 9-4-1-7-4.4-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Security
      </a>
      <a href="settings.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10.5a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10.5a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="sideAvatar">--</div>
        <div class="who">
          <strong id="sideName">&nbsp;</strong>
          <span id="sideEmail">&nbsp;</span>
        </div>
      </div>
      <button type="button" class="btn btn-on-ink btn-block btn-sm" id="logoutBtn">
        <span class="spinner"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="panel-actions" style="margin-bottom:18px;">
      <a href="user-management.html" class="btn btn-ghost btn-sm">User Management</a>
      <a href="users.html" class="btn btn-ghost btn-sm">User List</a>
      <a href="status.html" class="btn btn-ghost btn-sm">Status</a>
      <a href="membership.html" class="btn btn-ghost btn-sm">Membership</a>
    </div>
    <a href="users.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Users
    </a>

    <div class="page-head">
      <div>
        <h1 id="formTitle">Create user</h1>
        <p id="formSubtitle">Add a new profile to your workspace.</p>
      </div>
    </div>

    <div id="loadState" style="display:none;"></div>

    <section class="panel" id="formPanel">
      <div id="topAlert" class="alert alert-hidden" role="status" aria-live="polite"></div>

      <form id="userForm" class="form-stack" novalidate>
        <div class="form-grid">
          <div class="field" id="nameField">
            <label for="fullName">Full name</label>
            <input class="input" type="text" id="fullName" name="fullName" placeholder="Enter full name">
            <p class="error-text"></p>
          </div>

          <div class="field" id="emailField">
            <label for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" placeholder="name@company.com">
            <p class="error-text"></p>
          </div>

          <div class="field" id="departmentField">
            <label for="department">Department</label>
            <input class="input" type="text" id="department" name="department" placeholder="e.g. Engineering">
            <p class="error-text"></p>
          </div>

          <div class="field" id="jobTitleField">
            <label for="jobTitle">Job title</label>
            <input class="input" type="text" id="jobTitle" name="jobTitle" placeholder="e.g. Product Designer">
            <p class="error-text"></p>
          </div>

          <div class="field" id="phoneField">
            <label for="phone">Phone <span class="helper-text">(optional)</span></label>
            <input class="input" type="tel" id="phone" name="phone" placeholder="e.g. +1 555 010 0199">
            <p class="error-text"></p>
          </div>

          <div class="field" id="statusField">
            <label for="status">Status</label>
            <select class="select-input" id="status" name="status" style="width:100%;">
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="inactive">Inactive</option>
              <option value="suspended">Suspended</option><option value="banned">Banned</option>
            </select>
            <p class="error-text"></p>
          </div>

          <div class="field" id="membershipField">
            <label for="membership">Membership</label>
            <select class="select-input" id="membership" name="membership" style="width:100%;">
              <option value="free">Free</option>
              <option value="basic">Basic</option>
              <option value="pro">Pro</option>
              <option value="enterprise">Enterprise</option>
            </select>
            <p class="error-text"></p>
          </div>

          <div class="field field-full" id="bioField">
            <label for="bio">Bio <span class="helper-text">(optional)</span></label>
            <textarea class="input" id="bio" name="bio" rows="3" placeholder="A short note about this user"></textarea>
            <p class="error-text"></p>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span class="spinner"></span>
            <span id="submitLabel">Create user</span>
          </button>
          <a href="users.html" class="btn btn-ghost" id="cancelBtn">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/users.js"></script>
<script>
(function(){
  var Auth = window.AxivonAuth, UI = window.AxivonUI, Users = window.AxivonUsers;

  var session = Auth.requireAuth();
  if (!session) return;

  var sessionUser = Auth.currentUser();
  if (!sessionUser) {
    Auth.clearSession();
    location.replace('login.html');
    return;
  }

  document.getElementById('gate').style.display = 'none';
  document.getElementById('appShell').style.display = 'grid';

  document.getElementById('sideAvatar').textContent = Auth.initials(sessionUser.fullName);
  document.getElementById('sideName').textContent = sessionUser.fullName;
  document.getElementById('sideEmail').textContent = sessionUser.email;

  function doLogout(btn){
    UI.setLoading(btn, true);
    setTimeout(function(){
      Auth.logout();
      location.href = 'login.html?loggedout=1';
    }, 400);
  }
  document.getElementById('logoutBtn').addEventListener('click', function(){ doLogout(this); });

  // ---------------- create / edit form ----------------
  var S = Users.State;
  var id = UI.qs('id');
  var isEdit = !!id;
  var existingUser = null;

  var formPanel = document.getElementById('formPanel');
  var loadState = document.getElementById('loadState');
  var topAlert = document.getElementById('topAlert');
  var form = document.getElementById('userForm');
  var submitBtn = document.getElementById('submitBtn');
  var submitLabel = document.getElementById('submitLabel');
  var cancelBtn = document.getElementById('cancelBtn');

  var fields = {
    fullName: { el: document.getElementById('fullName'), wrap: document.getElementById('nameField') },
    email: { el: document.getElementById('email'), wrap: document.getElementById('emailField') },
    department: { el: document.getElementById('department'), wrap: document.getElementById('departmentField') },
    jobTitle: { el: document.getElementById('jobTitle'), wrap: document.getElementById('jobTitleField') },
    phone: { el: document.getElementById('phone'), wrap: document.getElementById('phoneField') },
    status: { el: document.getElementById('status'), wrap: document.getElementById('statusField') },
    membership: { el: document.getElementById('membership'), wrap: document.getElementById('membershipField') },
    bio: { el: document.getElementById('bio'), wrap: document.getElementById('bioField') }
  };

  document.getElementById('formTitle').textContent = isEdit ? 'Edit user' : 'Create user';
  document.getElementById('formSubtitle').textContent = isEdit
    ? 'Update this profile\u2019s information, status and membership.'
    : 'Add a new profile to your workspace.';
  submitLabel.textContent = isEdit ? 'Save changes' : 'Create user';
  cancelBtn.setAttribute('href', isEdit ? 'user-details.html?id=' + encodeURIComponent(id) : 'users.html');

  function validators() {
    return {
      fullName: function(){ var r = Users.Validators.fullName(fields.fullName.el.value); return apply('fullName', r); },
      email: function(){
        var r = Users.Validators.email(fields.email.el.value);
        if (r.valid && Users.emailTaken(fields.email.el.value, isEdit ? id : null)) {
          r = { valid: false, message: 'Another user already uses this email.' };
        }
        return apply('email', r);
      },
      department: function(){ return apply('department', Users.Validators.department(fields.department.el.value)); },
      jobTitle: function(){ return apply('jobTitle', Users.Validators.jobTitle(fields.jobTitle.el.value)); },
      phone: function(){ return apply('phone', Users.Validators.phone(fields.phone.el.value)); }
    };
  }
  function apply(key, r) {
    if (!r.valid) { UI.setFieldError(fields[key].wrap, r.message); return false; }
    UI.clearFieldError(fields[key].wrap, true);
    return true;
  }

  var V = validators();
  fields.fullName.el.addEventListener('blur', V.fullName);
  fields.email.el.addEventListener('blur', V.email);
  fields.department.el.addEventListener('blur', V.department);
  fields.jobTitle.el.addEventListener('blur', V.jobTitle);
  fields.phone.el.addEventListener('blur', V.phone);

  ['fullName','email','department','jobTitle','phone'].forEach(function(key){
    fields[key].el.addEventListener('input', function(){
      if (fields[key].wrap.classList.contains('has-error')) V[key]();
    });
  });

  function populate(u) {
    fields.fullName.el.value = u.fullName || '';
    fields.email.el.value = u.email || '';
    fields.department.el.value = u.department || '';
    fields.jobTitle.el.value = u.jobTitle || '';
    fields.phone.el.value = u.phone || '';
    fields.status.el.value = u.status || 'active';
    fields.membership.el.value = u.membership || 'free';
    fields.bio.el.value = u.bio || '';
  }

  function showForm(){ loadState.style.display = 'none'; formPanel.style.display = ''; }
  function showLoadState(kind, opts){ formPanel.style.display = 'none'; loadState.style.display = ''; Users.renderDataState(loadState, kind, opts); }

  function init() {
    if (!isEdit) { showForm(); return; }
    showLoadState('loading', { title: 'Loading user\u2026', message: 'Fetching the existing profile.' });
    setTimeout(function(){
      existingUser = Users.getById(id);
      if (!existingUser) {
        showLoadState('error', { title: 'User not found', message: 'This user may have been removed.', actionHtml: '<a href="users.html" class="btn btn-ghost btn-sm">Back to Users</a>' });
        return;
      }
      populate(existingUser);
      showForm();
    }, 350);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    UI.hideAlert(topAlert);

    var results = [V.fullName(), V.email(), V.department(), V.jobTitle(), V.phone()];
    if (results.indexOf(false) !== -1) {
      UI.showAlert(topAlert, 'error', 'Check the fields below', 'A few things need fixing before this can be saved.');
      return;
    }

    UI.setLoading(submitBtn, true);
    var payload = {
      fullName: fields.fullName.el.value,
      email: fields.email.el.value,
      department: fields.department.el.value,
      jobTitle: fields.jobTitle.el.value,
      phone: fields.phone.el.value,
      status: fields.status.el.value,
      membership: fields.membership.el.value,
      bio: fields.bio.el.value
    };

    setTimeout(function(){
      var result = isEdit ? Users.update(id, payload) : Users.create(payload);
      if (!result.ok) {
        UI.setLoading(submitBtn, false);
        UI.showAlert(topAlert, 'error', 'Couldn\u2019t save', result.error);
        return;
      }
      UI.showAlert(topAlert, 'success', isEdit ? 'Changes saved' : 'User created', 'Taking you to their profile\u2026');
      setTimeout(function(){
        location.href = 'user-details.html?id=' + encodeURIComponent(result.user.id);
      }, 600);
    }, 650);
  });

  init();
})();
</script>
</body>
</html>
