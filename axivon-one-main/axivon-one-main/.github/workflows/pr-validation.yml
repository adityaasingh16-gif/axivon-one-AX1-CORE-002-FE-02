name: PR Task-Based Branch Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-branch-and-title:
    name: Validate Task-Based Branching
    runs-on: ubuntu-latest
    steps:
      - name: Verify Branch Name Format
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH_NAME"
          # Ensure branch follows task format e.g. feature/AX1-CORE-001-FE-01 or fix/AX1-CORE-001-BE-02
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|chore|docs|test)/AX1-CORE-[0-9]{3}-(UX|FE|BE|FS)-[0-9]{2}$ ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does NOT adhere to task-based naming standard!"
            echo "Expected format: feature/AX1-CORE-001-FE-01 (Employee IDs like feature/EMP101 are forbidden)."
            exit 1
          fi
